# Render Blueprint for WASL | وَصل.
# One click: https://render.com/deploy?repo=https://github.com/rinas-abdullah/wasl
# Free plans sleep after ~15 min idle (first request then takes ~1 min) and the free database expires after 30 days.
databases:
  - name: wasl-db
    plan: free
    databaseName: wasl
    user: wasl
    postgresMajorVersion: "16"

services:
  - type: web
    name: wasl-intelligence
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/intelligence/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: INTELLIGENCE_API_KEY
        generateValue: true

  - type: web
    name: wasl-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase: { name: wasl-db, property: connectionString }
      - key: INTELLIGENCE_URL
        fromService: { type: web, name: wasl-intelligence, property: host }
      - key: INTELLIGENCE_API_KEY
        fromService: { type: web, name: wasl-intelligence, envVarKey: INTELLIGENCE_API_KEY }
      - key: APP_PUBLIC_URL
        fromService: { type: web, name: wasl-web, property: host }
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO_ON_START
        value: "true"
      - key: DEMO_PASSWORD
        value: Wasl@Demo2026
      - key: COOKIE_SECURE
        value: "true"

  - type: web
    name: wasl-web
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/web/Dockerfile
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: "3000"
      - key: API_INTERNAL_URL
        fromService: { type: web, name: wasl-api, property: host }
